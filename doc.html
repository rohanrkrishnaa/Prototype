<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOS Insights — Product Documentation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap');
  :root{
    --orange:#FF7A59; --orange-dk:#E8613C; --teal:#0091AE;
    --bg:#ffffff; --panel:#F5F8FA; --border:#DFE3EB;
    --navy:#33475B; --ink:#213343; --muted:#516F90; --soft:#FFF3EF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Lexend Deca','Segoe UI',Arial,Helvetica,sans-serif;color:var(--navy);background:var(--bg);
       font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:var(--teal);text-decoration:none}
  a:hover{text-decoration:underline}

  /* top bar */
  header{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 28px;
         position:sticky;top:0;background:#fff;z-index:20}
  header .mark{width:30px;height:30px;border-radius:8px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  header .title{font-size:16px;font-weight:700;color:var(--ink)}
  header .title span{color:var(--orange)}
  header .spacer{flex:1}
  header .hlabel{color:var(--muted);font-size:12.5px;font-weight:600}

  /* doc layout */
  .doc{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 60px)}

  /* left nav */
  nav.side{border-right:1px solid var(--border);background:var(--panel);padding:26px 0;position:sticky;top:60px;
           height:calc(100vh - 60px);overflow-y:auto}
  nav.side .grp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
                padding:6px 28px;margin-top:10px}
  nav.side ul{list-style:none}
  nav.side a{display:block;padding:9px 28px;font-size:14.5px;color:var(--navy);font-weight:500;
             border-left:3px solid transparent;cursor:pointer}
  nav.side a:hover{background:#ECEFF3;text-decoration:none;color:var(--ink)}
  nav.side a.active{color:var(--orange-dk);font-weight:700;background:var(--soft);border-left-color:var(--orange)}

  /* article */
  main{padding:44px 64px 96px;max-width:940px}
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:22px}
  .crumbs a{font-weight:600}
  .crumbs .sep{color:#C7CFD6;margin:0 8px}
  article h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.12;color:var(--ink);margin-bottom:14px}
  article .lead{font-size:18px;color:var(--navy);margin-bottom:28px;line-height:1.6}
  article h2{font-size:23px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:44px 0 6px;padding-top:26px;border-top:1px solid var(--border)}
  article h2:first-of-type{border-top:none;padding-top:0}
  article h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:24px 0 8px}
  article p{margin:12px 0;color:var(--navy)}
  article .fsub{color:var(--orange-dk);font-weight:600;font-size:15.5px;margin:2px 0 10px}
  article ul{margin:12px 0 12px 4px;list-style:none}
  article li{margin:9px 0;color:var(--navy);padding-left:24px;position:relative}
  article li::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
  .callout{margin:20px 0;padding:16px 18px;background:var(--soft);border-left:4px solid var(--orange);border-radius:8px;color:var(--ink);font-size:15px}
  .callout strong{color:var(--orange-dk)}
  .imgph{margin:20px 0 8px;aspect-ratio:16/6;border:1px dashed #C7D0DB;border-radius:12px;
         background:repeating-linear-gradient(45deg,#F5F8FA,#F5F8FA 14px,#EAF0F6 14px,#EAF0F6 28px);
         display:grid;place-items:center;color:#8A97A8;text-align:center}
  .imgph .ico{font-size:26px}
  .imgph .key{font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:6px}
  .imgph.has-img{aspect-ratio:auto;background:#fff;padding:0;overflow:hidden;border-style:solid}
  .imgph.has-img img{width:100%;height:auto;display:block}
  .muted-note{color:var(--muted);font-style:italic}
  .article-foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px}

  /* lifecycle flow diagram */
  .flowwrap{margin:26px 0 10px;border:1px solid var(--border);border-radius:12px;background:#fff;overflow-x:auto}
  .flowwrap svg{display:block;min-width:820px;width:100%;height:auto;font-family:'Lexend Deca','Segoe UI',Arial,sans-serif}
  .flow-cap{color:var(--muted);font-size:12.5px;margin:0 0 8px}
  /* chip explanation popover, anchored to the chip that opened it */
  .flowbox{position:relative}
  .chippop{position:absolute;z-index:5;display:none;width:390px;max-width:calc(100% - 16px);
           padding:16px 18px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--teal);
           border-radius:10px;box-shadow:0 10px 30px rgba(33,51,67,.18)}
  .chippop.on{display:block}
  .chipdet-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .chipdet-t{font-size:16px;font-weight:700;color:var(--ink);margin:2px 0 6px;padding-right:20px}
  .chippop p{margin:0;color:var(--navy);font-size:14.5px}
  .chippop-x{position:absolute;top:10px;right:12px;border:none;background:none;cursor:pointer;
             font:inherit;font-size:20px;line-height:1;color:#8A97A8;padding:2px 4px}
  .chippop-x:hover{color:var(--orange-dk)}
  .chipdet-s{margin-top:10px;display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
             letter-spacing:.05em;padding:3px 9px;border-radius:20px}
  .chipdet-s.live{background:#FFEDE7;color:var(--orange-dk)}
  .chipdet-s.part{background:#E4F4F8;color:var(--teal)}
  .chipdet-s.plan{background:#EEF1F5;color:var(--muted);border:1px dashed #C0CAD6}

  /* status legend under a diagram */
  .legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 6px;font-size:12px;color:var(--muted)}
  .legend .lg{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid var(--orange)}
  .legend .d-live{background:var(--orange)}
  .legend .d-part{background:var(--teal);border-color:var(--teal)}
  .legend .d-plan{background:#fff}
  .legend .d-build{background:var(--orange);border-radius:2px}
  .legend .d-test{background:var(--teal);border-color:var(--teal);border-radius:2px}
  .legend .d-rel{background:var(--navy);border-color:var(--navy);border-radius:2px;transform:rotate(45deg)}
  .legend .lg-note{font-style:italic}

  /* segregation table */
  .tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin:18px 0 6px}
  table.seg{border-collapse:collapse;width:100%;min-width:660px;font-size:13.5px}
  table.seg th{background:var(--panel);text-align:left;padding:11px 14px;font-size:11px;font-weight:700;
               text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border)}
  table.seg td{padding:11px 14px;border-bottom:1px solid #EDF1F5;vertical-align:top;color:var(--navy)}
  table.seg tr:last-child td{border-bottom:none}
  table.seg td strong{color:var(--ink)}
  .segn{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
  .own,.st{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .o-meritto{background:#EEF1F5;color:var(--muted)}
  .o-kosinsights,.o-take{background:#FFEDE7;color:var(--orange-dk)}
  .o-koscore{background:#FFEDE7;color:var(--orange-dk)}
  .o-both{background:#E4F4F8;color:var(--teal)}
  .o-neither{background:#fff;color:var(--muted);border:1px dashed #C0CAD6}
  .o-keep{background:#EEF1F5;color:var(--muted);border:1px solid #DFE3EB}
  .s-live{background:#FFEDE7;color:var(--orange-dk)}
  .s-part{background:#E4F4F8;color:var(--teal)}
  .s-plan{background:#fff;color:var(--muted);border:1px dashed #C0CAD6}
  table.seg tr.seggrp td{background:var(--soft);color:var(--orange-dk);font-weight:700;font-size:11px;
                         text-transform:uppercase;letter-spacing:.06em;padding:8px 14px;
                         border-bottom:1px solid #F3D9D0}

  ul.ticks li::before{content:"";position:absolute;left:0;top:6px;width:14px;height:8px;border-radius:0;
                      border-left:2.5px solid var(--orange);border-bottom:2.5px solid var(--orange);
                      transform:rotate(-45deg);background:none}
  ul.ticks li{padding-left:26px}
  .wherep{margin:8px 0 26px;font-size:14px}
  .wherek{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
          color:var(--muted);margin-right:10px}
  .wherep a{font-weight:600;cursor:pointer}
  .wherep .sep{color:#C7CFD6}

  /* feature accordion */
  .sec-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:36px 0 14px}
  .facc-list{display:flex;flex-direction:column;gap:12px}
  .facc{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;transition:box-shadow .15s}
  .facc.open{box-shadow:0 4px 16px rgba(33,51,67,.08)}
  .facc-head{width:100%;background:none;border:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
             padding:18px 20px;display:flex;gap:14px;align-items:center}
  .facc-head:hover{background:var(--panel)}
  .facc-t{flex:1;min-width:0}
  .facc-n{display:block;font-size:16.5px;font-weight:700;color:var(--ink)}
  .facc-o{display:block;color:var(--navy);font-size:14.5px;margin-top:2px}
  .facc-c{color:var(--orange);font-size:24px;line-height:1;transition:transform .2s;flex:none}
  .facc.open .facc-c{transform:rotate(90deg)}
  .facc-b{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 20px}
  .facc.open .facc-b{max-height:1600px;padding:2px 20px 22px}
  .facc-b h3{margin-top:20px}
  .facc-b .imgph{margin-top:4px}

  @media (max-width:840px){
    .doc{grid-template-columns:1fr}
    nav.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
    main{padding:30px 24px 70px}
  }
</style>
</head>
<body>
  <header>
    <div class="mark">Ki</div>
    <div class="title">KOS <span>Insights</span></div>
    <div class="spacer"></div>
    <div class="hlabel">Product Documentation</div>
  </header>

  <div class="doc">
    <nav class="side" id="side"></nav>
    <main><div id="article"></div></main>
  </div>

<script>
  // ---------------------------------------------------------------------------------------------
  // The major lifecycles. Each drives one diagram and its walkthrough, so a stage is edited once.
  //   m = modules the stage runs on   c = the points inside it   d = the walkthrough paragraph
  // A point carries a status: undefined = live today, "part" = partly built, "plan" = to be built.
  // Statuses are set from what the code actually does, not from what we intend it to do.
  // ---------------------------------------------------------------------------------------------
  var FLOWS = {};

  FLOWS.lead = {
    name:"Lead Lifecycle",
    lede:"From the moment a student first reaches you to the moment they pay an application fee.",
    stages:[
    { t:"Lead enters", s:"Every path a student arrives by",
      m:["lead-capture","integrations","partner-management","campaign-management"],
      c:[{ t:"Self-hosted KOS forms", s:"plan", ph:"Phase 4",
           x:"Your own form, embedded on your site, writing straight into Insights. Capture round-trips " +
             "through Meritto today." },
         { t:"TEP and partner uploads",
           x:"A partner's file lands as leads stamped with that agent, so the claim and the cost per " +
             "admission stay provable." },
         { t:"Own database uploads",
           x:"Fair and seminar spreadsheets. Every row becomes a lead in the background, and the file " +
             "returns marked row by row." },
         { t:"Inbound WhatsApp",
           x:"An unknown number opens a lead on the spot, filed under the current season and tagged " +
             "direct WhatsApp." },
         { t:"Website chatbot",
           x:"The chat opens a temporary lead, made real the moment the student shares details, " +
             "conversation attached." },
         { t:"Inbound and outbound calls", s:"plan", ph:"Phase 1",
           x:"A call registers the student as a lead. Today a call only attaches to a lead that already " +
             "exists, and is dropped if none matches." }],
      d:[
           "Six ways in, and one lead in one workspace after that.",
           "Forms, partner files, spreadsheets, WhatsApp, chatbot, calls.",
           "Every route round-trips through Meritto today. Phase 4 ends that.",
           "Two paths still to build: our own forms, and registering off a call."] },

    { t:"Assigned to a counsellor", s:"A rule engine, not a black box",
      m:["crm","sales-management","user-role-management"],
      c:[{ t:"Meritto allocates today",
           x:"The counsellor arrives on the webhook as sales_agent_email. Meritto's algorithm owns " +
             "allocation, and Insights simply records it." },
         { t:"Rules on lead template fields", s:"plan", ph:"Phase 2",
           x:"Route on any field the template captures: programme, city, intake or source. Your rules, " +
             "read in the open." },
         { t:"Round robin first", s:"plan", ph:"Phase 2",
           x:"Allocation leaves Meritto on the simplest rule that works, so the cutover is provable " +
             "before it is clever." },
         { t:"Capacity and load balancing", s:"plan", ph:"Phase 2",
           x:"Weigh how many live leads a counsellor already holds, so nobody is buried and nobody " +
             "sits idle." },
         { t:"Weighted by conversion", s:"plan", ph:"Phase 6",
           x:"Later, route on who actually converts this kind of student, with trend analysis behind " +
             "the weighting." },
         { t:"Owner plus support counsellors",
           x:"A lead carries one owner and any number of support counsellors. Notes and history travel " +
             "with it on reassignment." }],
      d:[
           "An owner within seconds, and the lifecycle runs on that counsellor.",
           "Meritto picks the counsellor today and hands it over on a webhook.",
           "Ours in two steps: template rules, round robin and capacity first.",
           "Weighting by who actually converts comes later, once the data is ours."] },

    { t:"Automated nurturing starts", s:"The first touches need no counsellor",
      m:["marketing-automation","ai-nurturing","crm"],
      c:[{ t:"Enrolled the moment it lands",
           x:"A new or changed lead is picked up off the database stream and enrolled into every journey " +
             "it qualifies for." },
         { t:"WhatsApp on your own number",
           x:"Templates go out on the institute's business number as soon as the lead qualifies, with no " +
             "counsellor involved." },
         { t:"Fills in what is missing",
           x:"Where programme or intake is blank, nurturing asks the student and writes the answer back " +
             "onto the lead." },
         { t:"Waits on delivered and read",
           x:"The journey holds until the message is really delivered or read, then branches on what " +
             "happened." },
         { t:"Automated calling", s:"plan", ph:"Phase 3",
           x:"Calls placed by the platform on the institute number, alongside the WhatsApp touches." }],
      d:[
           "First contact happens before a counsellor ever opens the lead.",
           "Journeys fill in what capture missed: programme, intake.",
           "WhatsApp carries this today, on your own business number.",
           "The journey waits for a real read before deciding what to send next."] },

    { t:"Automation and AI sales", s:"Admin-built journeys that sell",
      m:["marketing-automation","ai-nurturing","campaign-management"],
      c:[{ t:"Journeys drawn by admins",
           x:"An admin lays out the trigger, the filters, the splits and the sends on a canvas. No " +
             "developer and no release." },
         { t:"Sells against the programme",
           x:"What the student is told is keyed to the programme they want, so the pitch fits the course " +
             "and not the crowd." },
         { t:"The AI number works the lead",
           x:"Sia handles the conversation inside the journey on the same number, rather than beside it " +
             "in a separate tool." },
         { t:"Handover to a counsellor",
           x:"A warm lead is handed to its counsellor with a brief, so the first human call never starts " +
             "cold." },
         { t:"Draft, publish and version",
           x:"Journeys are versioned. Publishing a change never disturbs the leads already moving " +
             "through the old one." },
         { t:"Beyond WhatsApp", s:"plan", ph:"Phase 3",
           x:"Email, SMS and call steps join WhatsApp, which is the last thing Meritto's automations " +
             "still do better." }],
      d:[
           "Admins draw the journeys. No developer, no release.",
           "The pitch is keyed to the programme the student actually wants.",
           "Sia works inside the journey, on the same number, not beside it.",
           "Live today, but WhatsApp only. Email, SMS and calls are Phase 3."] },

    { t:"Application form trigger", s:"Qualified leads get the form",
      m:["crm","lead-capture","integrations"],
      c:[{ t:"Fires on a lead stage", s:"plan", ph:"Phase 5",
           x:"Reaching the qualifying stage sends the application form. No counsellor chases and no list " +
             "is worked by hand." },
         { t:"Form and fee to the student", s:"plan", ph:"Phase 5",
           x:"The student receives the application form and pays the application fee against it." },
         { t:"Returns as an application", s:"plan", ph:"Phase 5",
           x:"The completed form comes back into KOS Core as an application record tied to the lead it " +
             "came from." },
         { t:"Read in KOS Core", s:"plan", ph:"Phase 5",
           x:"Counsellors read applicant data in KOS Core, which is what removes the Meritto login from " +
             "their day." },
         { t:"Meritto runs the form itself",
           x:"Meritto keeps the application form and its lifecycle. Insights decides when it fires; " +
             "Meritto executes." }],
      d:[
           "The qualifying stage sends the form. Nobody chases a list.",
           "The student pays, and the application returns into KOS Core.",
           "Counsellors read applicants in KOS Core, not in Meritto.",
           "Meritto keeps the form engine. Insights decides when it fires."] }
  ]};

  FLOWS.counsellor = {
    name:"Counsellor and Admin Lifecycle",
    lede:"From an account being created to an admin watching the whole team's numbers.",
    stages:[
    { t:"Counsellor is created", s:"An account, a login, a scope",
      m:["user-role-management","sales-management"],
      c:[{ t:"Created on Insights with a login",
           x:"A counsellor is set up in Insights and gets their own login. No shared accounts and no " +
             "borrowed credentials." },
         { t:"Scoped to their institutes",
           x:"Multi-institute groups scope a counsellor to the institutes they actually work, under one " +
             "account." },
         { t:"Role shapes the sidebar", s:"part",
           x:"A role decides what a user sees in the navigation. It does not yet gate the APIs behind " +
             "it, so treat it as presentation, not enforcement." },
         { t:"Bulk counsellor upload",
           x:"Counsellors and their lead assignments can be loaded from a file rather than clicked in " +
             "one by one." }],
      d:[
           "An account and a login of their own. No shared credentials.",
           "Scoped to the institutes they actually work.",
           "Loaded in bulk from a file when a team arrives at once.",
           "Roles shape the sidebar, not the API. Presentation, not enforcement."] },

    { t:"Logs in to a prepared day", s:"The queue is ready before they are",
      m:["sales-management","ai-nurturing","crm"],
      c:[{ t:"An AI-built daily queue",
           x:"The day opens as a worked list rather than a database. Who to call, in what order, and why." },
         { t:"Ordered by score and intent",
           x:"The hottest students rise on their own, with the reasons behind the score there to read." },
         { t:"Missed follow-ups flagged",
           x:"Anything slipping is surfaced rather than silently ageing at the bottom of a list." },
         { t:"A battle card per lead",
           x:"Suggested next step, talking points and what was said last time, before the call connects." }],
      d:[
           "The day opens as a worked list, not as a database.",
           "Ordered by score, with the reasons there to read.",
           "Missed follow-ups surface instead of ageing quietly.",
           "A battle card per student, before the call connects."] },

    { t:"Works the lead", s:"Calls, WhatsApp and email",
      m:["crm","integrations","sales-management"],
      c:[{ t:"Moves the lead through stages", s:"plan", ph:"Phase 1",
           x:"The counsellor drives the lifecycle off what the student does. No endpoint exists here " +
             "today; the stage arrives from Meritto." },
         { t:"WhatsApp on the institute number", s:"part",
           x:"Counsellors WhatsApp students from Meritto today. The number and the sending are ours; " +
             "only automation and Sia use them." },
         { t:"Click to call from Insights", s:"plan", ph:"Phase 1",
           x:"Counsellors dial from Meritto today. The call is logged back here and scored, but it " +
             "never starts here." },
         { t:"Email a lead from Insights", s:"plan", ph:"Phase 1",
           x:"Counsellors email students from Meritto today, so the thread lives outside the platform " +
             "they work in." },
         { t:"Shared chats across the team",
           x:"A conversation belongs to the institute, not to one counsellor's handset, so cover is " +
             "possible." },
         { t:"Every touch on one timeline",
           x:"Calls, WhatsApp, email, chatbot, human and AI, in one chronological view of the student." }],
      d:[
           "Counsellors already call, WhatsApp and email leads, and move stages. All in Meritto.",
           "Phase 1 brings the lot inside, and takes away their daily reason to open Meritto.",
           "Shared chats, and one timeline across every channel.",
           "Sending is already ours; today only automation and Sia use it."] },

    { t:"Admin tracks the team", s:"Activity, quality and outcomes",
      m:["sales-management","ai-analytics","user-role-management"],
      c:[{ t:"Counsellor performance dashboard",
           x:"Activity and outcomes per counsellor, side by side, without anyone assembling a sheet." },
         { t:"Call quality scores",
           x:"Calls are transcribed and scored, so quality is read from what was said, not from a tally " +
             "of dials." },
         { t:"Productivity and engagement reports",
           x:"What the team did, and what it moved. Exportable when someone upstairs asks." },
         { t:"Reassign in bulk",
           x:"When staffing or priorities shift, books move in bulk and the history travels with them." }],
      d:[
           "See the team without having to ask the team.",
           "Call quality read from the transcript, not from a tally of dials.",
           "Activity measured against outcomes, and exportable.",
           "Books move in bulk, and the history travels with them."] }
  ]};

  FLOWS.campaign = {
    name:"Campaign Lifecycle",
    lede:"From a campaign being built to knowing what it cost you per admission.",
    stages:[
    { t:"Campaign is created", s:"Built, budgeted and tracked",
      m:["campaign-management","attribution"],
      c:[{ t:"Campaign creation and management",
           x:"Build the campaign, hold its budget, and keep spend against it in the same place as its " +
             "results." },
         { t:"Smart tracking links",
           x:"Links that carry the campaign with them, so a click is still attributable when the student " +
             "converts weeks later." },
         { t:"UTM mapping",
           x:"Your UTM scheme mapped once, so source, medium and campaign mean the same thing in every " +
             "report." },
         { t:"Landing pages",
           x:"The page behind the ad, held alongside the campaign that pays for it." }],
      d:[
           "Budget, spend and results held in one place.",
           "Tracking links that survive all the way to the enrolment.",
           "A UTM scheme that means one thing in every report."] },

    { t:"Tracked to the campaign", s:"Attribution that survives",

  }

          outcome:"People who work across roles or institutes stay on one login." },
        { n:"Secure Login & SSO", img:true,
          crisp:"Secure sign-in with password reset and Microsoft SSO.",
          intro:"Users sign in securely, reset forgotten passwords themselves, and organisations can enable Microsoft single sign-on for one-click, centrally managed access.",
          points:[
            "Secure login with self-service password reset.",
            "Microsoft single sign-on (SSO).",
            "Session management built in."],
          outcome:"Access is secure and easy, whether by password or SSO." },
        { n:"Institute & Account Management", img:true,
          crisp:"Manage your institutes and accounts, with users scoped to each.",
          intro:"Set up and manage the institutes under your account, including aliases and FAQs, and scope users to the institutes they belong to, ideal for groups running multiple institutes.",
          points:[
            "Manage institutes under one account.",
            "Configure institute aliases and FAQs.",
            "Scope users to their institutes.",
            "Run multiple institutes from one platform."],
          outcome:"Multi-institute groups stay organised under one roof." }
      ] }
  ];

  // build left nav
  var side = document.getElementById("side");
  var navHtml = '<ul><li><a data-id="" onclick="go(\'\')">Overview</a></li></ul>' +
                '<div class="grp">Lifecycles</div><ul>';
  Object.keys(FLOWS).forEach(function(k){
    navHtml += '<li><a data-id="" onclick="goFlow(\''+k+'\')">'+FLOWS[k].name+'</a></li>';
  });
  navHtml += '</ul><div class="grp">Plans</div><ul>' +
             '<li><a data-id="decoupling" onclick="go(\'decoupling\')">Decoupling from Meritto</a></li>' +
             '</ul><div class="grp">Modules</div><ul>';
  MODULES.forEach(function(m){
    navHtml += '<li><a data-id="'+m.id+'" onclick="go(\''+m.id+'\')">'+m.name+'</a></li>';
  });
  navHtml += '</ul>';
  side.innerHTML = navHtml;

  function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
  function imgph(key){
    return '<div class="imgph"><div><div class="ico">&#128444;</div>' +
           '<div class="key">&lt;!-- IMG: '+key+' --&gt;</div></div></div>';
  }

  function renderModule(m){
    var h = "<h1>"+m.name+"</h1><p class='lead'>"+m.desc+"</p>";
    h += imgph(m.id);
    if(m.features && m.features.length){
      h += "<div class='sec-label'>Features</div><div class='facc-list'>";
      m.features.forEach(function(f){
        var body = "";
        if(f.img)   body += imgph(m.id+"-"+slugify(f.n));
        if(f.intro) body += "<p>"+f.intro+"</p>";
        if(f.points && f.points.length){
          body += "<h3>Key capabilities</h3><ul>";
          f.points.forEach(function(pt){ body += "<li>"+pt+"</li>"; });
          body += "</ul>";
        }
        if(f.outcome) body += "<div class='callout'><strong>Why it matters:</strong> "+f.outcome+"</div>";
        h += "<div class='facc'>" +
               "<button class='facc-head' onclick='toggleFacc(this)'>" +
                 "<span class='facc-t'><span class='facc-n'>"+f.n+"</span>" +
                 "<span class='facc-o'>"+f.crisp+"</span></span>" +
                 "<span class='facc-c'>&rsaquo;</span>" +
               "</button>" +
               "<div class='facc-b'>"+body+"</div>" +
             "</div>";
      });
      h += "</div>";
    } else {
      h += "<p class='muted-note'>Detailed documentation for this section is in progress.</p>";
    }
    return h;
  }

  function toggleFacc(btn){ btn.parentNode.classList.toggle("open"); }

  function go(id){ location.hash = id ? id : ""; render(); }

  // The lifecycles live on the Overview; jump to the one asked for rather than to a page of its own.
  function goFlow(key){
    if(location.hash.replace("#","") !== ""){ location.hash = ""; render(); }
    var el = document.getElementById(key);
    if(el){ el.scrollIntoView({behavior:"smooth", block:"start"}); }
  }

  function render(){
    var id = location.hash.replace("#","");
    var m = MODULES.filter(function(x){ return x.id===id; })[0];
    var page = PAGES[id];
    var crumbs, body;
    if(m){
      crumbs = "<a onclick=\"go('')\">Documentation</a><span class='sep'>&rsaquo;</span>" + m.name;
      body = renderModule(m);
    } else if(page){
      crumbs = "<a onclick=\"go('')\">Documentation</a><span class='sep'>&rsaquo;</span>" + page.name;
      body = page.body();
    } else {
      crumbs = "Documentation";
      body = OVERVIEW.body();
    }
    document.getElementById("article").innerHTML =
      "<div class='crumbs'>"+crumbs+"</div><article>"+body+"</article>" +
      "<div class='article-foot'>© 2026 KOS Insights · Product Documentation · Internal &amp; sales enablement use</div>";
    // active nav state
    document.querySelectorAll("nav.side a").forEach(function(a){
      a.classList.toggle("active", a.getAttribute("data-id") === id);
    });
    window.scrollTo(0,0);
  }

  window.addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
